<!DOCTYPE html>
<html>
<head>
  <title>Admin Login - Embassy</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-box { max-width:400px; margin:100px auto; padding:30px; background:white; border-radius:12px; text-align:center; }
    input { width:90%; padding:10px; margin:10px 0; border-radius:8px; border:1px solid #ccc; }
    button { background:#111; color:white; padding:12px 25px; border:none; border-radius:8px; cursor:pointer; }
    button:hover { background:#FFD700; color:#111; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    
    <div id="loginForm">
      <input type="password" id="password" placeholder="Enter Admin Password">
      <br>
      <button onclick="checkLogin()">Login</button>
      <p id="error" style="color:red;"></p>
    </div>

    <div id="adminPanel" class="hidden">
      <h3>✅ Welcome</h3>
      <p>Add new sermon details here. Then copy the code below to index.html</p>
      
      <input type="text" id="title" placeholder="Sermon Title">
      <input type="text" id="speaker" placeholder="Speaker Name">
      <input type="text" id="date" placeholder="Date: Sept 1, 2026">
      <input type="text" id="link" placeholder="MP3 Link or Google Drive Link">
      
      <button onclick="generateCode()">Generate Sermon Code</button>
      
      <textarea id="output" rows="6" style="width:90%; margin-top:10px;"></textarea>
      <p>Copy this and paste in index.html inside the messages section</p>
    </div>
  </div>

<script>
  const ADMIN_PASSWORD = "embassy2027"; // <-- CHANGE THIS PASSWORD

  function checkLogin(){
    const pass = document.getElementById('password').value;
    if(pass === ADMIN_PASSWORD){
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
    } else {
      document.getElementById('error').innerText = "Wrong Password!";
    }
  }

  function generateCode(){
    const t = document.getElementById('All message').value;
    const s = document.getElementById('Pastor Bright Adeyi').value;
    const d = document.getElementById('2026/2027').value;
    const l = document.getElementById('coming soon').value;
    
    const code = `
<div class="sermon-card">
  <h3>${t}</h3>
  <p>Speaker: ${s} | Date: ${d}</p>
  <a href="${l}" target="_blank" class="download-btn">Download MP3</a>
</div>`;
    document.getElementById('output').value = code;
  }
</script>
</body>
</html>
